services:
   stable-diffusion:
    image: jcsdev/automatic1111
    volumes:
      - ${DATA_DIR}picai/models:/app/models
      - ${DATA_DIR}picai/repositories:/app/repositories
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTHONUNBUFFERED=1
      # Gradio UI credentials, injected at runtime so they never end up baked
      # into an image layer. See .env.example.
      - SD_USER=${SD_USER:?SD_USER must be set in .env}
      - SD_PASS=${SD_PASS:?SD_PASS must be set in .env}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 60s
    container_name: stable-diffusion
    networks:
      - ai_network
