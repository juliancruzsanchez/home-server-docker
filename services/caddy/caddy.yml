services:
  desec-caddy-sync:
    container_name: desec-caddy-sync
    image: jcsdev/desec-caddy-sync:latest
    restart: no
    env_file:
      - path: ../../.env
        required: true
    volumes:
      - ./Caddyfile:/home/node/app/Caddyfile
  caddy:
    container_name: caddy
    image: caddy:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ${DATA_DIR}caddy/site:/srv
      - ${DATA_DIR}caddy/data:/data
      - ${DATA_DIR}caddy/config:/config
    env_file:
      - path: ../../.env
        required: true
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - proxy

networks:
  proxy:
    ipam:
      driver: default
      config:
        - subnet: 172.11.0.0/16

volumes:
  caddy_data:
  caddy_config:
